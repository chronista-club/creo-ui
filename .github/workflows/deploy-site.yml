# creo-ui 公式 site を doc.anycreative.tech へ deploy する CD。
#
# trigger = release cut: nightly → main の release PR が merge され main に push された時。
# (nightly の日々の push では動かない — 公開 site は release 品質を追う)
#
# deploy は cf CLI (apps/site の devDependency で版を固定)。設定は apps/site/cloudflare.config.ts。
#
# 前提 secrets (repo settings で登録):
#   CLOUDFLARE_API_TOKEN  — Workers を deploy できる API token
#                           (実体は 1Password `CreoMemories/shared-cloudflare` の `cfworker_token`)
#   CLOUDFLARE_ACCOUNT_ID — 同 item の `account_id`
#

name: Deploy site (doc.anycreative.tech)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - name: Checkout creo-ui
        uses: actions/checkout@v4
        with:
          path: creo-ui

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # cf は Node.js の LTS で動かす
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build site
        working-directory: creo-ui
        run: |
          bun install --frozen-lockfile
          bun run site:build

      # secrets を渡す前に、build output と設定だけを確かめる
      - name: Check deploy (dry run)
        working-directory: creo-ui/apps/site
        run: bunx cf deploy --dry-run

      - name: Deploy to Cloudflare Workers
        working-directory: creo-ui/apps/site
        run: bunx cf deploy --message "release ${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
