# npm への publish は Trusted Publishing (OIDC) で行う — token は使わない。
#
# 2026-10 以降、CI からの token publish に npm が one-time password を要求する (EOTP)。
# granular token を作り直しても同じ (npm は 2025-09 に 2FA bypass の廃止方針を出した)。
# 2026-10-05 / 10-30 の editor-host 0.9.0 / 0.10.0 publish が連続して落ちた原因。
# 代わりに GitHub Actions の OIDC token で「この repo のこの workflow file からの
# publish」を npmjs.com に信頼させる。npmjs.com 側の設定が無いと E404 で落ちる:
#   package → Settings → Trusted Publisher → GitHub Actions
#   organization: chronista-club / repository: creo-ui / workflow: <このファイル名> /
#   environment: 空 / allowed: npm publish
# 要件: `permissions: id-token: write` と npm ≥ 11.5.1 (Node 24 同梱で満たす)。
# provenance は OIDC + public repo で自動付与 (package.json の repository.url が
# この repo と一致していること)。設計: docs/design/release-flow.md
name: Publish @chronista-club/creo-ui-layout to npm

on:
  push:
    tags: ["layout-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json, or leave blank to use current)"
        required: false

permissions:
  contents: read
  id-token: write # OIDC (npm Trusted Publishing、冒頭コメント参照)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creo-ui
    steps:
      - name: Checkout creo-ui
        uses: actions/checkout@v4
        with:
          path: creo-ui

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (root workspace)
        run: bun install --frozen-lockfile

      - name: Test (protocol core — property + golden)
        working-directory: creo-ui/packages/layout
        run: bun test src

      - name: Typecheck (layout build config)
        working-directory: creo-ui/packages/layout
        run: bun run typecheck:build

      - name: Build layout (vite lib)
        working-directory: creo-ui/packages/layout
        # vite + vite-plugin-solid で /solid の JSX を事前 compile、vite-plugin-dts で .d.ts 生成。
        # 出力は packages/layout/dist/ (gitignore) に入る。
        run: bun run build

      - name: Verify dist artifacts
        run: |
          test -s packages/layout/dist/index.js
          test -s packages/layout/dist/index.d.ts
          test -s packages/layout/dist/solid/index.js
          test -s packages/layout/dist/solid/index.d.ts

      - name: Publish to npm
        working-directory: creo-ui/packages/layout
        run: npm publish --access public
