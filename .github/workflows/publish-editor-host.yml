# npm への publish は Trusted Publishing (OIDC) で行う — token は使わない。
#
# 2FA bypass の無い token で CI から publish すると npm が one-time password を要求する
# (EOTP。2026-10-05 / 10-30 に editor-host 0.9.0 / 0.10.0 が連続して落ちた原因。bypass 付き
# token に替えた 10-30 06:28 JST の再実行は通った)。bypass 付き token には寿命があり、npm は
# 2025-09 に bypass 廃止の方針を出しているので、token に依らない OIDC へ切替える。
# 代わりに GitHub Actions の OIDC token で「この repo のこの workflow file からの
# publish」を npmjs.com に信頼させる。npmjs.com 側の設定が無いと E404 で落ちる:
#   package → Settings → Trusted Publisher → GitHub Actions
#   organization: chronista-club / repository: creo-ui / workflow: <このファイル名> /
#   environment: 空 / allowed: npm publish
# 要件: `permissions: id-token: write` と npm ≥ 11.5.1 (Node 24 同梱で満たす)。
# provenance は OIDC + public repo で自動付与 (package.json の repository.url が
# この repo と一致していること)。設計: docs/design/release-flow.md
name: Publish @chronista-club/creo-ui-editor-host to npm

on:
  push:
    tags: ["editor-host-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json, or leave blank to use current)"
        required: false

permissions:
  contents: read
  id-token: write # OIDC (npm Trusted Publishing、冒頭コメント参照)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creo-ui
    steps:
      - name: Checkout creo-ui
        uses: actions/checkout@v4
        with:
          path: creo-ui

      - uses: oven-sh/setup-bun@v2
        with:
          # 1.4.4 fails to load Solid JSX in runtime tests (jsxDEV); verified with 1.4.2.
          bun-version: "1.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies (root workspace)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run editor-host tests
        run: bun test packages/editor-host/src/

      - name: Build editor-host (vite lib)
        working-directory: creo-ui/packages/editor-host
        # vite + vite-plugin-solid で JSX を事前 compile、vite-plugin-dts で .d.ts 生成。
        # 出力は packages/editor-host/dist/ (gitignore) に入る。
        run: bun run build

      - name: Verify dist artifacts
        run: |
          test -s packages/editor-host/dist/index.js
          test -s packages/editor-host/dist/index.d.ts

      - name: Publish to npm
        working-directory: creo-ui/packages/editor-host
        run: npm publish --access public
